<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Monblanproject</title>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Roboto:wght@300;400;500;700&display=swap"
              rel="stylesheet">
      <script type="module" crossorigin src="/Monblanproject/assets/index-fBY01A1k.js"></script>
      <link rel="stylesheet" crossorigin href="/Monblanproject/assets/index-C9Yoma8I.css">
    </head>
    <body>
        <header class="header">
            <div class="header__container">
                <img class="header__logo" src="/Monblanproject/images/logo.svg" alt="logo">
                <div class="header__content">
                    <div class="header__title">
                        <h1 class="header__title--text">monblanproject</h1>
                        <span class="header__title--description">Start on  17-02-2016</span>
                    </div>
                    <div class="header__stats">
                        <div class="header__stats_posts">
                            <span class="header__stats_posts--count text__bold">0</span>
                            <span class="header__stats_posts--label">posts</span>
                        </div>
                        <div class="header__stats_posts">
                            <span class="header__stats_posts text__bold">11,787</span>
                            <span class="header__stats_posts--label">followers</span>
                        </div>
                        <div class="header__stats_posts">
                            <span class="header__stats_posts text__bold">112</span>
                            <span class="header__stats_posts--label">following</span>
                        </div>
                    </div>
                    <div class="header__date">
                        <span>Date</span>
                        <div class="header__date--field">
                            <input id="from" type="text" placeholder="from">

                            <button
                                    type="button"
                                    class="header__date--field-clear"
                                    data-target="from">
                                <img src="/Monblanproject/images/close-icon.svg" alt="close">
                            </button>
                            <img class="header__date--field-calendar" src="/Monblanproject/images/calendar-icon.svg" alt="calendar">
                        </div>
                        <div class="header__date--field">
                            <input id="to" type="text" placeholder="to">

                            <button
                                    type="button"
                                    class="header__date--field-clear"
                                    data-target="to">
                                <img src="/Monblanproject/images/close-icon.svg" alt="close">
                            </button>
                            <img class="header__date--field-calendar" src="/Monblanproject/images/calendar-icon.svg" alt="calendar">
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="container">
            <div class="view-btns">
                <button id="rowsBtn" class="btn-row">
                    <img src="/Monblanproject/images/rows-icon.svg" alt="rows">
                </button>
                <button id="tilesBtn" class="btn-tiles">
                    <img src="/Monblanproject/images/tiles-icon.svg" alt="tiles">
                </button>
            </div>

            <div id="posts" class="posts posts--rows"></div>
            <div class="load-more-container">
                <button id="loadMore" class="load-more">Load more</button>
            </div>
        </main>

    </body>
</html>
